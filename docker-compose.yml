version: '3.8'

services:
  wcoflix-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wcoflix-downloader
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      # Optional: Configure proxy for Cloudflare bypass
      # - PROXY_URL=http://your-proxy:port
      # - USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    volumes:
      - wcoflix_downloads:/tmp/wcoflix_downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "coolify.managed=true"
      - "coolify.type=dockerfile"

volumes:
  wcoflix_downloads:
    driver: local